name: readme-cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=akanyane&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&hide_border=false&title_color=B91C1C&icon_color=B91C1C&text_color=EDEBE8&bg_color=0D0D0D&border_color=262626&locale=en
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=akanyane&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&hide_border=false&title_color=B91C1C&text_color=EDEBE8&bg_color=0D0D0D&border_color=262626
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
